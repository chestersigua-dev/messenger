<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Tabs</title>
  <style>
    :root {
      --bg: #18191a;
      --card: #242526;
      --card-hover: rgba(255, 255, 255, 0.08);
      --accent: #0084ff;
      --text: #e4e6eb;
      --text-muted: #a8b3cf;
      --border: rgba(255, 255, 255, 0.08);
      --badge-bg: #fa3e3e;
      --badge-text: #ffffff;
      --tab-height: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1;
      height: var(--tab-height);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
    }

    .app-brand-icon {
      width: 22px;
      height: 22px;
      margin-right: 6px;
      margin-left: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .app-brand-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: -0.1px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      outline: none;
      border: 1px solid transparent;
    }

    .tab-item:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .tab-item:active {
      transform: scale(0.98);
    }

    .tab-item.active {
      background: var(--card);
      color: var(--text);
      border-color: var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 10px;
      right: 10px;
      height: 2.5px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 0 8px var(--accent);
    }

    .tab-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .tab-label {
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-badge {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px;
      font-weight: 700;
      margin-left: 2px;
      animation: badgePulse 2s infinite ease-in-out;
    }

    .tab-badge.visible {
      display: inline-flex;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .tab-shortcut-hint {
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.6;
      margin-left: 2px;
    }

    .switch-page-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      height: 25px;
      border-radius: 6px;
      background: rgba(0, 132, 255, 0.12);
      border: 1px solid rgba(0, 132, 255, 0.28);
      color: var(--accent);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -0.1px;
      transition: all 0.15s ease;
      outline: none;
      margin-left: 2px;
    }

    .switch-page-action:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 132, 255, 0.35);
      transform: translateY(-1px);
    }

    .switch-page-action:active {
      transform: scale(0.96);
    }

    .switch-page-action svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .actions-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      outline: none;
    }

    .action-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .action-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 4px;
    }
  </style>
</head>
<body>
  <div class="tabs-container">
    <div class="app-brand-icon" title="Messenger Desktop">
      <!-- Messenger Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.477 2 2 6.145 2 11.258c0 2.91 1.454 5.513 3.734 7.218v3.524l3.376-1.854c.91.252 1.88.389 2.89.389 5.523 0 10-4.145 10-9.277C22 6.145 17.523 2 12 2zm1.066 12.443l-2.584-2.756-5.044 2.756 5.548-5.89 2.651 2.756 4.977-2.756-5.548 5.89z"/>
      </svg>
    </div>

    <!-- Personal Tab -->
    <div id="tab-personal" class="tab-item active" role="tab" tabindex="0" title="Personal Messenger (Ctrl+1)">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <span class="tab-label">Personal</span>
      <span id="badge-personal" class="tab-badge">0</span>
      <span class="tab-shortcut-hint">1</span>
    </div>

    <!-- Page Inbox Tab -->
    <div id="tab-page" class="tab-item" role="tab" tabindex="0" title="Page Inbox & Business Suite (Ctrl+2)">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
        </svg>
      </div>
      <span id="page-tab-label" class="tab-label">Page Inbox</span>
      <span id="badge-page" class="tab-badge">0</span>
      <span class="tab-shortcut-hint">2</span>
    </div>

    <!-- Quick Switch Page Button -->
    <button id="btn-switch-page" class="switch-page-action" title="Choose which Facebook Page to manage (Ctrl+Shift+P)" aria-label="Switch Page">
      <svg viewBox="0 0 24 24">
        <path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/>
      </svg>
      <span>Switch Page</span>
    </button>
  </div>

  <div class="actions-container">
    <!-- Reload Tab Button -->
    <button id="btn-reload" class="action-btn" title="Reload Active Tab (Ctrl+R)" aria-label="Reload Active Tab">
      <svg viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>

    <!-- Popout / External Window Button -->
    <button id="btn-popout" class="action-btn" title="Open Page in Separate Window" aria-label="Open Page in Separate Window">
      <svg viewBox="0 0 24 24">
        <path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
      </svg>
    </button>

    <div class="divider"></div>

    <!-- Settings Button -->
    <button id="btn-settings" class="action-btn" title="Preferences & Themes" aria-label="Preferences & Themes">
      <svg viewBox="0 0 24 24">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>
  </div>

  <script>
    const personalTabEl = document.getElementById('tab-personal');
    const pageTabEl = document.getElementById('tab-page');
    const pageTabLabelEl = document.getElementById('page-tab-label');
    const badgePersonalEl = document.getElementById('badge-personal');
    const badgePageEl = document.getElementById('badge-page');
    const reloadBtn = document.getElementById('btn-reload');
    const popoutBtn = document.getElementById('btn-popout');
    const settingsBtn = document.getElementById('btn-settings');

    let currentActiveTab = 'personal';

    function setActiveTab(tab) {
      currentActiveTab = tab;
      if (tab === 'personal') {
        personalTabEl.classList.add('active');
        pageTabEl.classList.remove('active');
      } else {
        pageTabEl.classList.add('active');
        personalTabEl.classList.remove('active');
      }
    }

    function updateBadges(counts) {
      if (!counts) return;

      const pCount = counts.personal || 0;
      if (pCount > 0) {
        badgePersonalEl.textContent = pCount > 99 ? '99+' : String(pCount);
        badgePersonalEl.classList.add('visible');
      } else {
        badgePersonalEl.classList.remove('visible');
      }

      const pgCount = counts.page || 0;
      if (pgCount > 0) {
        badgePageEl.textContent = pgCount > 99 ? '99+' : String(pgCount);
        badgePageEl.classList.add('visible');
      } else {
        badgePageEl.classList.remove('visible');
      }
    }

    function applyTheme(theme) {
      if (!theme || !theme.previewColors) return;
      const root = document.documentElement;
      root.style.setProperty('--bg', theme.previewColors.bg);
      root.style.setProperty('--card', theme.previewColors.card);
      root.style.setProperty('--accent', theme.previewColors.accent);
      root.style.setProperty('--text', theme.previewColors.text);

      if (theme.category === 'light') {
        root.style.setProperty('--card-hover', 'rgba(0, 0, 0, 0.05)');
        root.style.setProperty('--border', 'rgba(0, 0, 0, 0.1)');
        root.style.setProperty('--text-muted', '#65676b');
      } else {
        root.style.setProperty('--card-hover', 'rgba(255, 255, 255, 0.08)');
        root.style.setProperty('--border', 'rgba(255, 255, 255, 0.08)');
        root.style.setProperty('--text-muted', '#a8b3cf');
      }
    }

    // Tab Click handlers
    personalTabEl.addEventListener('click', () => {
      setActiveTab('personal');
      if (window.tabbarAPI) window.tabbarAPI.switchTab('personal');
    });

    pageTabEl.addEventListener('click', () => {
      setActiveTab('page');
      if (window.tabbarAPI) window.tabbarAPI.switchTab('page');
    });

    reloadBtn.addEventListener('click', () => {
      if (window.tabbarAPI) window.tabbarAPI.reloadActiveTab();
    });

    popoutBtn.addEventListener('click', () => {
      if (window.tabbarAPI) window.tabbarAPI.popoutPageWindow();
    });

    const switchPageBtn = document.getElementById('btn-switch-page');
    switchPageBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.tabbarAPI) window.tabbarAPI.openPageChooser();
    });

    settingsBtn.addEventListener('click', () => {
      if (window.tabbarAPI) window.tabbarAPI.openPreferences();
    });

    // API Event Listeners
    if (window.tabbarAPI) {
      window.tabbarAPI.onTabSwitched((tab) => {
        setActiveTab(tab);
      });

      window.tabbarAPI.onUpdateBadges((counts) => {
        updateBadges(counts);
      });

      window.tabbarAPI.onThemeChanged((theme) => {
        applyTheme(theme);
      });

      window.tabbarAPI.onSettingsChanged((settings) => {
        if (settings.pageInboxName) {
          pageTabLabelEl.textContent = settings.pageInboxName;
        }
      });

      // Load initial state
      window.tabbarAPI.getInitialState().then((state) => {
        if (state) {
          if (state.activeTab) setActiveTab(state.activeTab);
          if (state.counts) updateBadges(state.counts);
          if (state.settings?.pageInboxName) {
            pageTabLabelEl.textContent = state.settings.pageInboxName;
          }
          if (state.themes && state.settings?.theme) {
            const currentTheme = state.themes.find(t => t.id === state.settings.theme);
            if (currentTheme) applyTheme(currentTheme);
          }
        }
      }).catch(err => console.error('Error getting tabbar state:', err));
    }
  </script>
</body>
</html>
